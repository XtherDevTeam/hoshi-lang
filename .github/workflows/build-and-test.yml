
name: Build and Test

on:
  push:
    branches: [ llvm ]
  pull_request:
    branches: [ llvm ]

jobs:
  build-unix:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ ubuntu-latest, macos-latest ]

    steps:
      - uses: actions/checkout@v3

      - name: Install LLVM and Clang (Linux)
        if: runner.os == 'Linux'
        run: |
          wget https://apt.llvm.org/llvm.sh
          chmod +x llvm.sh
          sudo ./llvm.sh 20 all
          echo "LLVM_PATH=$(llvm-config-20 --prefix)" >> $GITHUB_ENV

      - name: Install LLVM and Clang (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install llvm@20
          echo "LLVM_PATH=$(brew --prefix llvm@20)" >> $GITHUB_ENV

      - name: Setup PATH
        run: echo "$LLVM_PATH/bin" >> $GITHUB_PATH

      - name: Verify Clang Path
        run: |
          which clang
          clang --version

      - name: Run tests
        env:
          CC: clang
          CXX: clang++
          LLVM_DIR: ${{ env.LLVM_PATH }}/lib/cmake/llvm
        run: python3 tools/code_test.py

      - name: Configure CMake
        env:
          CC: clang
          CXX: clang++
          LLVM_DIR: ${{ env.LLVM_PATH }}/lib/cmake/llvm
        run: make cmake_production

      - name: Build
        env:
          CC: clang
          CXX: clang++
          LLVM_DIR: ${{ env.LLVM_PATH }}/lib/cmake/llvm
        run: make build_production

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: hoshi-lang-${{ matrix.os }}
          path: |
            cmake-build-release/*hoshi_lang*
            cmake-build-release/*elysia_runtime*

  build-windows:
    runs-on: windows-latest
    strategy:
      matrix:
        toolchain: [ 'mingw', 'clang' ]
    steps:
      - uses: actions/checkout@v3

      - name: Install LLVM and Clang (Windows)
        run: |
          curl -L -o llvm.tar.xz https://github.com/llvm/llvm-project/releases/download/llvmorg-20.1.8/clang+llvm-20.1.8-x86_64-pc-windows-msvc.tar.xz
          tar -xf llvm.tar.xz
        shell: bash

      - name: Setup PATH Step 1
        run: |
          echo "LLVM_PATH=$PWD/clang+llvm-20.1.8-x86_64-pc-windows-msvc" >> $env:GITHUB_ENV
      
      - name: Setup PATH Step 2
        run: |
          echo "$PWD/clang+llvm-20.1.8-x86_64-pc-windows-msvc/bin" >> $env:GITHUB_PATH

      - name: Verify Clang Path
        run: |
          where clang
          clang --version

      - name: Set Compilers
        run: |
          if ("${{ matrix.toolchain }}" -eq "mingw") {
            echo "CC=gcc" >> $env:GITHUB_ENV
            echo "CXX=g++" >> $env:GITHUB_ENV
          } else {
            echo "CC=clang" >> $env:GITHUB_ENV
            echo "CXX=clang++" >> $env:GITHUB_ENV
          }

      - name: Run tests
        env:
          LLVM_DIR: ${{ env.LLVM_PATH }}/lib/cmake/llvm
        run: python3 tools/code_test.py

      - name: Configure CMake
        env:
          LLVM_DIR: ${{ env.LLVM_PATH }}/lib/cmake/llvm
        run: make cmake_production

      - name: Build
        env:
          LLVM_DIR: ${{ env.LLVM_PATH }}/lib/cmake/llvm
        run: make build_production

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: hoshi-lang-windows-${{ matrix.toolchain }}
          path: |
            cmake-build-release/*hoshi_lang*
            cmake-build-release/*elysia_runtime*

  build-docs:
    runs-on: ubuntu-latest
    steps:
      - uses: DenverCoder1/doxygen-github-pages-action@v1.2.0
        with:
          github_token: ${{ secrets.GH_TOKEN }}
          branch: gh-pages
          folder: doxygen/html
          config_file: Doxyfile